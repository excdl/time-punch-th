<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奇可智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}

body {
    font-family: "Arial", "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}

.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 16px 16px 32px 16px;
    gap: 16px;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
}

.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}

#statusInfo {
    font-size: 14px; 
    font-weight: bold;
    color: white;
    padding: 6px 14px; 
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}

.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}

.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}

.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    border: 1px solid #edf2f7;
}

#timeHour, #timeMin, #timeSec {
    font-size: 38px;       
    font-weight: normal;   
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}

.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}

@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}

#btnStart { background: var(--start-gradient); }
#btnEnd { background: var(--end-gradient); }

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}

button:not(:disabled):active {
    transform: scale(0.97);
}

.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}

#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

@keyframes bounce {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.1); }
    50%  { transform: scale(0.95); }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.bounce { animation: bounce 0.4s ease; }

.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
</style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <div class="user-profile-container">
      <div class="user-avatar" id="userAvatar">👤</div>
      <div class="user-profile">
        <div id="userInfo">載入中...</div>
        <div class="app-subtitle" id="headerDate">載入日期中...</div>
      </div>
    </div>
    <div id="statusInfo">檢查中...</div>
  </div>

  <div class="dashboard-card">
    <div class="clock-container">
      <div class="time-box"><span id="timeHour">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeMin">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeSec">00</span></div>
    </div>

    <div class="buttons-container">
      <button id="btnStart" disabled>上班</button>
      <button id="btnEnd" disabled>下班</button>
    </div>
  </div>

  <div class="section-container">
    <div class="section-title" onclick="refreshTodayRecords()">📋 今日打卡紀錄</div>
    <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
  </div>

  <button id="btnApprove">補打卡審批</button>
</div>
 
<script>
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxdEnL9HTtQ9pVwiXeoW6DoVdwcQwanI4PuAdJMxFRadjjYNmRHqv2AJGbhWN-wZ7sT/exec";
const COMPANY_IPS = [
    "220.132.124.179",
    "125.228.248.110",
    "114.34.128.159",
    "220.134.230.241",
    "27.240.177.116",
    "114.32.2.171",
    "114.34.203.176"
];

const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86",
    "U7fdf4fbd467b9a93a23fac01ed03351b"
];

const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");

window.userReady = false;
window.isClocking = false;
window.allowRemote = window.allowRemote || false; // 若未來有異地授權開關可直接支援

function updateDateTime() {
    const now = new Date();

    document.getElementById("timeHour").textContent =
        String(now.getHours()).padStart(2, "0");

    document.getElementById("timeMin").textContent =
        String(now.getMinutes()).padStart(2, "0");

    document.getElementById("timeSec").textContent =
        String(now.getSeconds()).padStart(2, "0");

    const dateStr = now.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });

    const weekdayStr = now.toLocaleDateString("zh-TW", {
        weekday: "long"
    });

    headerDate.textContent = `${dateStr} (${weekdayStr})`;
}

setInterval(updateDateTime, 1000);
updateDateTime();

function getTodayString() {
    const now = new Date();
    return now.toLocaleDateString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });
}

function isCompanyIP(ip) {
    return COMPANY_IPS.includes(ip);
}

async function getIP() {
    const cache = sessionStorage.getItem("myIP");
    if (cache) {
        return cache;
    }

    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => {
            controller.abort();
        }, 3000);

        const res = await fetch(
            "https://api.ipify.org?format=json",
            {
                signal: controller.signal,
                cache: "no-store"
            }
        );

        clearTimeout(timeout);

        if (!res.ok) {
            return "";
        }

        const data = await res.json();

        if (data && data.ip) {
            sessionStorage.setItem("myIP", data.ip);
            return data.ip;
        }
    } catch (err) {
        console.warn("取得 IP 失敗:", err);
    }

    return "";
}

// 預載 IP 封裝
async function preloadIP() {
    let ip = await getIP();
    if (!ip) {
        ip = await Promise.race([
            getIP(),
            new Promise(resolve => setTimeout(() => resolve(""), 2000))
        ]);
    }
    return ip;
}

// 網路逾時封裝
async function fetchWithTimeout(resource, options = {}, timeout = 15000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
        const response = await fetch(resource, {
            ...options,
            signal: controller.signal
        });
        clearTimeout(id);
        return response;
    } catch (error) {
        clearTimeout(id);
        throw error;
    }
}

// 取得 GPS 定位（若有異地打卡需求時使用）
async function getGeoLocation() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            reject(new Error("您的瀏覽器不支援地理定位功能"));
            return;
        }
        navigator.geolocation.getCurrentPosition(
            position => {
                resolve({
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                });
            },
            error => {
                reject(new Error("無法取得您的GPS定位，請確認是否授權定位權限"));
            },
            { timeout: 10000, enableHighAccuracy: true }
        );
    });
}

function fixTimeFormat(t) {
    if (typeof t === "string" && t.includes(":") && !t.includes("T")) {
        return t;
    }
    if (typeof t === "string" && t.includes("T")) {
        return new Date(t).toLocaleTimeString("zh-TW", { hour12: false });
    }
    if (!isNaN(t)) {
        const d = new Date((t - 25569) * 86400 * 1000);
        return d.toLocaleTimeString("zh-TW", { hour12: false });
    }
    return t;
}

// 按鈕鎖定狀態切換
function setButtonsLock(isLocked, startText = "處理中...", endText = "處理中...") {
    btnStart.disabled = isLocked;
    btnEnd.disabled = isLocked;
    btnStart.textContent = startText;
    btnEnd.textContent = endText;
}

function showClockLoading(title = "打卡中", text = "正在確認打卡資料，請稍候...") {
    Swal.fire({
        html: `
            <div style="padding:15px 0;text-align:center;">
                <div style="
                    width:50px;
                    height:50px;
                    margin:0 auto 18px auto;
                    border:4px solid #f3f3f3;
                    border-top:4px solid #3498db;
                    border-radius:50%;
                    animation:spin 0.8s linear infinite;
                "></div>

                <h3 style="
                    margin:0 0 8px 0;
                    color:#2c3e50;
                    font-size:20px;
                    font-weight:bold;
                ">
                    ${escapeHtml(title)}
                </h3>

                <p style="
                    margin:0;
                    color:#7f8c8d;
                    font-size:14px;
                ">
                    ${escapeHtml(text)}
                </p>

                <style>
                    @keyframes spin {
                        0% { transform:rotate(0deg); }
                        100% { transform:rotate(360deg); }
                    }
                </style>
            </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        backdrop: "rgba(0,0,0,0.5)",
        customClass: {
            popup: "custom-swal-popup"
        }
    });
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

async function updateUserInfo() {
    const liffInit = liff.init({
        liffId: "2008555754-M5oJ3AmD"
    });

    const [_, ip] = await Promise.all([
        liffInit,
        getIP()
    ]);

    if (!liff.isLoggedIn()) {
        await liff.login();
        return;
    }

    const [profile, finalIP] = await Promise.all([
        liff.getProfile(),
        Promise.resolve(ip)
    ]);

    window.userId = profile.userId;
    window.userName = profile.displayName;

    userInfo.textContent = `${window.userName} 您好`;

    if (profile.pictureUrl) {
        userAvatar.innerHTML = `
            <img
                src="${profile.pictureUrl}"
                alt="avatar"
                style="
                    width:100%;
                    height:100%;
                    border-radius:50%;
                    object-fit:cover;
                "
            >
        `;
    } else if (window.userName) {
        userAvatar.textContent = window.userName.charAt(0);
    }

    const approveButton = document.getElementById("btnApprove");
    if (approveButton) {
        approveButton.style.display =
            MANAGERS.includes(window.userId)
                ? "block"
                : "none";
    }

    const isCompany = isCompanyIP(finalIP);

    statusInfo.textContent = isCompany ? "公司網路" : "非公司網路";
    statusInfo.style.background = isCompany ? "#2ecc71" : "#e74c3c";

    btnStart.disabled = false;
    btnEnd.disabled = false;

    window.userReady = true;
}

async function updateTodayRecords(showAlert = false) {
    if (!window.userId) {
        return;
    }

    const today = getTodayString();

    try {
        const url =
            `${API_ENDPOINT}?action=getToday` +
            `&userId=${encodeURIComponent(window.userId)}` +
            `&date=${encodeURIComponent(today)}`;

        const res = await fetch(url, {
            method: "GET",
            mode: "cors",
            redirect: "follow",
            cache: "no-store"
        });

        if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
        }

        const data = await res.json();

        if (!data || !data.length) {
            todayRecords.innerHTML =
                `<div class="records-empty">今日尚無打卡紀錄</div>`;
            return;
        }

        const recordsHTML = data.map(r => {
            const color = r.status === "下班" ? "#2ecc71" : "#3498db";
            const time = fixTimeFormat(r.time);
            const networkLabel = isCompanyIP(r.ip) ? "公司網路" : "異地打卡";
            const networkColor = isCompanyIP(r.ip) ? "#7f8c8d" : "#e67e22";
            const makeupBadge = r.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";

            return `
                <div class="record-item" style="border-left-color:${color};">
                    <div class="record-info">
                        <div class="record-status">
                            ${escapeHtml(r.status)} ${makeupBadge}
                        </div>
                        <div class="record-details" style="color:${networkColor};">
                            ${networkLabel}
                        </div>
                    </div>
                    <div class="record-time" style="color:${color};">
                        ${time}
                    </div>
                </div>
            `;
        }).join("");

        todayRecords.innerHTML = recordsHTML;
    } catch (err) {
        console.error("今日紀錄讀取失敗:", err);
        todayRecords.innerHTML =
            `<div class="records-empty" style="color:#e74c3c;">今日打卡紀錄讀取失敗</div>`;
    }
}

function refreshTodayRecords() {
    const container = document.querySelector(".section-container");

    if (container) {
        container.classList.add("bounce");
        setTimeout(() => {
            container.classList.remove("bounce");
        }, 400);
    }

    updateTodayRecords(false).catch(err => {
        console.error("背景更新紀錄失敗:", err);
    });
}

async function sendSelfMessage(record) {
    if (!liff.isInClient()) {
        return;
    }

    let headerColor = "#3498db";
    if (record.status === "下班") headerColor = "#2ecc71";
    if (record.netType !== "公司網路") headerColor = "#e67e22";

    const reasonText =
        record.netType !== "公司網路" ? "異常原因：非公司網路" : "";

    try {
        await liff.sendMessages([{
            type: "flex",
            altText: `【打卡通知】${record.status}成功`,
            contents: {
                type: "bubble",
                header: {
                    type: "box",
                    layout: "vertical",
                    contents: [{
                        type: "text",
                        text: `${String(record.userName)} 已打卡`,
                        weight: "bold",
                        size: "lg",
                        color: "#ffffff"
                    }],
                    backgroundColor: headerColor,
                    paddingAll: "12px"
                },
                body: {
                    type: "box",
                    layout: "vertical",
                    spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${String(record.status)}`, size: "md" },
                        { type: "text", text: `時間：${String(record.date)} ${String(record.time)}`, size: "md" },
                        { type: "text", text: `網路：${String(record.netType)}`, size: "md" },
                        ...(reasonText ? [{ type: "text", text: reasonText, size: "md", color: "#e67e22" }] : [])
                    ]
                }
            }
        }]);
    } catch (err) {
        console.error("LINE 訊息傳送失敗:", err);
    }
}

/* =========================================================
   打卡主程式 (已整合穩定版邏輯)
========================================================= */
async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (window.isClocking) return;
    if (!window.userReady && !isMakeup) {
        await Swal.fire({
            icon: "warning",
            title: "提示",
            html: "<span style='color:#e67e22;'>目前為無效打卡區，無法打卡！</span>",
            timer: 1800,
            showConfirmButton: false,
            customClass: { popup: "custom-swal-popup" }
        });
        return;
    }
    if (!window.userId) {
        await Swal.fire({
            icon: "error",
            title: "打卡失敗",
            text: "尚未取得 LINE 使用者資訊，請重新整理頁面。",
            confirmButtonText: "確定",
            customClass: { popup: "custom-swal-popup" }
        });
        return;
    }

    window.isClocking = true;
    setButtonsLock(true, "處理中...", "處理中...");

    try {
        const ip = await preloadIP();
        if (!isMakeup && !isCompanyIP(ip) && !window.allowRemote) {
            throw new Error("非公司網路且未授權異地打卡！");
        }
        let lat = "";
        let lng = "";
        if (window.allowRemote && !isCompanyIP(ip)) {
            const geo = await getGeoLocation();
            lat = geo.lat;
            lng = geo.lng;
        }
        
        // 顯示載入動畫彈窗
        showClockLoading(isMakeup ? "補打卡中" : "打卡中", "正在確認打卡資料，請稍候...");

        const body = {
            userId: window.userId,
            displayName: window.userName,
            status: status,
            ip: ip,
            lat: lat,
            lng: lng,
            customDate: customDate,
            customTime: customTime,
            isMakeup: isMakeup
        };

        let apiData;
        try {
            const response = await fetchWithTimeout(API_ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(body)
            }, 15000);
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const responseText = await response.text();
            if (!responseText) throw new Error("伺服器沒有回傳資料");
            
            try {
                apiData = JSON.parse(responseText);
            } catch (jsonError) {
                console.error("API 回傳內容:", responseText);
                throw new Error("伺服器回覆格式錯誤");
            }
        } catch (networkError) {
            console.error("打卡 API 錯誤:", networkError);
            Swal.close();
            await Swal.fire({
                icon: "error",
                title: "打卡連線異常",
                html: `<span style="color:#c0392b;">網路連線異常，請至下方「今日打卡紀錄」確認是否已打卡成功</span>`,
                confirmButtonText: "確定",
                customClass: { popup: "custom-swal-popup" }
            });
            await updateTodayRecords(false);
            return;
        }

        Swal.close();

        const message = String(apiData?.message || "");
        // 兼容舊版 API 回傳格式與通用成功判定
        const isSuccess = message.includes("成功") || message.includes("更新") || apiData.success !== false;

        if (isSuccess) {
            const finalDate = apiData.date || getTodayString();
            const finalTime = apiData.time || new Date().toLocaleTimeString("zh-TW", { hour12: false });
            const netTypeStr = window.allowRemote ? "異地打卡(GPS)" : (isCompanyIP(ip) ? "公司網路" : "非公司網路");

            sendSelfMessage({
                userName: window.userName,
                status: status,
                date: finalDate,
                time: finalTime,
                netType: netTypeStr
            }).catch(error => {
                console.warn("背景傳送 LINE 訊息失敗:", error);
            });

            await Swal.fire({
                icon: "success",
                title: isMakeup ? "🎉 補打卡成功！" : (status === "下班" ? "🎉 下班打卡成功！" : "🎉 上班打卡成功！"),
                html: `<div style="font-size:16px;margin-top:8px;"><strong>打卡時間：</strong><br><span style="color:#2980b9;font-size:18px;font-weight:bold;">${escapeHtml(finalDate)} ${escapeHtml(finalTime)}</span></div>`,
                showConfirmButton: false,
                timer: 1800,
                backdrop: "rgba(0,0,0,0.5)",
                customClass: { popup: "custom-swal-popup" }
            });
        } else {
            await Swal.fire({
                icon: "error",
                title: "打卡提示",
                html: `<span style="color:#c0392b;">${escapeHtml(apiData?.message || "打卡失敗，請檢查網路！")}</span>`,
                confirmButtonText: "確定",
                customClass: { popup: "custom-swal-popup" }
            });
        }
        await updateTodayRecords(false);
    } catch (error) {
        console.error("performClockIn 發生錯誤:", error);
        Swal.close();
        await Swal.fire({
            icon: "error",
            title: "打卡失敗",
            html: `<span style="color:#c0392b;">${escapeHtml(error?.message || "系統發生錯誤，請稍後再試")}</span>`,
            confirmButtonText: "確定",
            customClass: { popup: "custom-swal-popup" }
        });
    } finally {
        Swal.close();
        window.isClocking = false;
        setButtonsLock(false, "上班打卡", "下班打卡");
        try {
            await updateTodayRecords(false);
        } catch (error) {
            console.warn("重新檢查紀錄失敗:", error);
        }
    }
}

btnStart.onclick = () => { performClockIn("上班"); };
btnEnd.onclick = () => { performClockIn("下班"); };

const approveButton = document.getElementById("btnApprove");
if (approveButton) {
    approveButton.onclick = () => {
        window.location.href =
            "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
    };
}

window.onload = async () => {
    fetch(`${API_ENDPOINT}?action=ping`, { cache: "no-store" }).catch(() => {});

    try {
        await updateUserInfo();
        await updateTodayRecords();
    } catch (err) {
        console.error("初始化失敗:", err);
    }
};
</script>

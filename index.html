<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}

body {
    font-family: "Arial", "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}

/* App 外框容器，充滿行動裝置畫面 */
.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 16px 16px 32px 16px;
    gap: 16px;
}

/* App 頂部導覽列 */
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

/* 虛擬頭像樣式 */
.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
}

.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}

/* 狀態標籤縮小 20% 且強制不換行 */
#statusInfo {
    font-size: 14px; 
    font-weight: bold;
    color: white;
    padding: 6px 14px; 
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}

/* 核心儀表板卡片 */
.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}

/* 數位時鐘樣式 */
.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}

.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    border: 1px solid #edf2f7;
}

#timeHour, #timeMin, #timeSec {
    font-size: 38px;       
    font-weight: normal;   
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}

.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}

@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

/* 大打卡按鈕群組 */
.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}

#btnStart { background: var(--start-gradient); }
#btnEnd { background: var(--end-gradient); }

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}

button:not(:disabled):active {
    transform: scale(0.97);
}

/* 今日打卡紀錄區塊 */
.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}

/* 簽核按鈕 */
#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

/* SweetAlert2 自訂外觀 */
.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
</style>
</head>
<body>

<div class="app-container">
  <!-- 頂部資訊列 -->
  <div class="app-header">
    <div class="user-profile-container">
      <div class="user-avatar" id="userAvatar">👤</div>
      <div class="user-profile">
        <div id="userInfo">載入中...</div>
        <div class="app-subtitle" id="headerDate">載入日期中...</div>
      </div>
    </div>
    <div id="statusInfo">檢查中...</div>
  </div>

  <!-- 打卡儀表板主卡片 -->
  <div class="dashboard-card">
    <div class="clock-container">
      <div class="time-box"><span id="timeHour">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeMin">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeSec">00</span></div>
    </div>

    <div class="buttons-container">
      <button id="btnStart" disabled>上班</button>
      <button id="btnEnd" disabled>下班</button>
    </div>
  </div>

  <!-- 今日紀錄卡片 -->
  <div class="section-container">
    <div class="section-title">📅 今日打卡紀錄</div>
    <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
  </div>

  <!-- 主管簽核按鈕 -->
  <button id="btnApprove">查看 | 簽核</button>
</div>
 
<script>
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbyFxfbkYTyjcjUv7pjScPQApUOtk11hVQ3_BFnQIYvWvwIYsfaX_K6mcpmUXvvUAYwJFQ/exec";
const COMPANY_IPS  = ["220.134.112.245", "114.34.60.48"];
const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"
];

const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");

window.userReady = false;
window.allowRemote = false;

// ====== 更新日期時間與星期 ======
function updateDateTime() {
    const now = new Date();
    
    document.getElementById("timeHour").textContent = String(now.getHours()).padStart(2, '0');
    document.getElementById("timeMin").textContent = String(now.getMinutes()).padStart(2, '0');
    document.getElementById("timeSec").textContent = String(now.getSeconds()).padStart(2, '0');
    
    const dateStr = now.toLocaleDateString("zh-TW", { year: 'numeric', month: '2-digit', day: '2-digit' });
    const weekdayStr = now.toLocaleDateString("zh-TW", { weekday: 'long' });
    headerDate.textContent = `${dateStr} (${weekdayStr})`;
}
setInterval(updateDateTime, 1000);
updateDateTime();

// ====== 按鈕鎖定控制 ======
function setButtonsLock(locked, startText = "上班", endText = "下班") {
    btnStart.disabled = locked;
    btnEnd.disabled = locked;
    btnStart.textContent = startText;
    btnEnd.textContent = endText;
    window.userReady = !locked;
}

// ====== 預載入與取得 IP ======
async function preloadIP() {
    const cache = sessionStorage.getItem("myIP");
    if (cache) return cache;

    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);
        const res = await fetch("https://api.ipify.org?format=json", { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();
        sessionStorage.setItem("myIP", data.ip);
        return data.ip;
    } catch {
        return "";
    }
}

// ====== 初始化 LIFF 使用者 ======
async function initUser() {
    await liff.init({ liffId: "2008520938-4018BD8v" });
    if (!liff.isLoggedIn()) {
        await liff.login();
        return;
    }
    const profile = await liff.getProfile();
    window.userId = profile.userId;
    window.userName = profile.displayName;

    userInfo.textContent = `${window.userName} 您好`;
    
    if (profile.pictureUrl) {
        userAvatar.innerHTML = `<img src="${profile.pictureUrl}" alt="avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
    } else if (window.userName) {
        userAvatar.textContent = window.userName.charAt(0);
    }

    document.getElementById("btnApprove").style.display = MANAGERS.includes(window.userId) ? "block" : "none";
}

// ====== 狀態與打卡權限判定 ======
async function updateStatus(forceRefresh = false) {
    const cachedIP = await preloadIP();
    const isCompany = COMPANY_IPS.includes(cachedIP);

    if (isCompany) {
        statusInfo.textContent = "有效打卡區";
        statusInfo.style.background = "#2ecc71";
        setButtonsLock(false, "上班", "下班");
        window.allowRemote = false;
        return;
    }

    let remoteAllowed = false;
    if (window.userId) {
        try {
            const remoteRes = await fetch(`${API_ENDPOINT}?action=checkRemote&userId=${window.userId}`);
            const remoteData = await remoteRes.json();
            remoteAllowed = remoteData.allowed || false;
        } catch(err) {
            console.error("查詢允許異地失敗", err);
        }
    }
    window.allowRemote = remoteAllowed;

    if (remoteAllowed) {
        statusInfo.textContent = "有效打卡區(異地)";
        statusInfo.style.background = "#2ecc71";
        setButtonsLock(false, "上班", "下班");
    } else {
        statusInfo.textContent = "無效打卡區";
        statusInfo.style.background = "#e74c3c";
        setButtonsLock(true, "上班", "下班");
    }
}

// ====== 取得手機 GPS 經緯度 ======
function getGeoLocation() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            resolve({ lat: "", lng: "" });
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (position) => {
                resolve({ lat: position.coords.latitude, lng: position.coords.longitude });
            },
            () => resolve({ lat: "", lng: "" }),
            { timeout: 5000, enableHighAccuracy: true }
        );
    });
}

// ====== 時間格式處理 ======
function fixTimeFormat(t) {
    if (typeof t === "string" && t.includes(":") && !t.includes("T")) return t;
    if (typeof t === "string" && t.includes("T")) return new Date(t).toLocaleTimeString("zh-TW", { hour12: false });
    if (!isNaN(t)) {
        const d = new Date((t - 25569) * 86400 * 1000);
        return d.toLocaleTimeString("zh-TW", { hour12: false });
    }
    return t;
}

// ====== 初始化載入 ======
window.onload = async () => {
  statusInfo.textContent = "檢查中...";
  statusInfo.style.background = "#95a5a6";
  setButtonsLock(true, "同步中...", "同步中...");

  try {
    await Promise.all([
      initUser(),
      preloadIP()
    ]);
    
    await updateStatus(true);
    await updateTodayRecords();
    await updateStatus(true);

  } catch (error) {
    console.error("初始化失敗", error);
    userInfo.textContent = "初始化失敗";
    statusInfo.textContent = "重整失敗";
    statusInfo.style.background = "#e74c3c";
  }
};

/* ===== 打卡後發送 Flex Message ===== */
async function sendSelfMessage(record) {
    if (!liff.isInClient()) return;
    let headerColor = record.status === "下班" ? "#2ecc71" : "#3498db"; 
    try {
        await liff.sendMessages([{
            type: 'flex',
            altText: '打卡通知',
            contents: {
                type: "bubble",
                header: {
                    type: "box", layout: "vertical",
                    contents: [{ type: "text", text: `${record.userName} 已打卡`, weight: "bold", size: "lg", color: "#ffffff" }],
                    backgroundColor: headerColor, paddingAll: "12px"
                },
                body: {
                    type: "box", layout: "vertical", spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${record.status}`, size: "md" },
                        { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
                        { type: "text", text: `網路：${record.netType}`, size: "md" }
                    ]
                }
            }
        }]);
        await new Promise(r => setTimeout(r, 800));
    } catch(err) {
        console.error("LIFF 訊息傳送失敗:", err);
    }
}

// ===== 打卡函式 =====
async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (!window.userReady && !isMakeup) {
        Swal.fire({ 
            icon: "warning", 
            title: "提示", 
            html: "<span style='color: #e67e22;'>目前為無效打卡區，無法打卡！</span>", 
            timer: 1800, 
            showConfirmButton: false,
            customClass: { popup: 'custom-swal-popup' }
        });
        return;
    }

    const ip = await preloadIP();

    if (!isMakeup && !COMPANY_IPS.includes(ip) && !window.allowRemote) {
        Swal.fire({
            icon: "error",
            title: "打卡失敗",
            html: `<span style="color:#e74c3c; font-weight:bold;">非公司網路且未授權異地打卡！</span>`,
            confirmButtonText: "確定",
            customClass: { popup: 'custom-swal-popup' }
        });
        return;
    }

    let lat = "", lng = "";
    if (window.allowRemote && !COMPANY_IPS.includes(ip)) {
        const geo = await getGeoLocation();
        lat = geo.lat;
        lng = geo.lng;
    }

    Swal.fire({
        html: `
            <div style="padding: 15px 0; text-align: center;">
                <div style="width: 50px; height: 50px; margin: 0 auto 18px auto; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                <h3 style="margin: 0 0 8px 0; color: #2c3e50; font-size: 20px; font-weight: bold;">系統打卡處理中</h3>
                <p style="margin: 0; color: #7f8c8d; font-size: 14px;">正在與雲端伺服器安全同步，請稍候...</p>
                <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
            </div>
        `,
        showConfirmButton: false, 
        allowOutsideClick: false, 
        backdrop: "rgba(0,0,0,0.5)",
        customClass: { popup: 'custom-swal-popup' }
    });

    let apiData = null;
    try {
        const res = await fetch(API_ENDPOINT, {
            method: "POST",
            body: JSON.stringify({ userId: window.userId, displayName: window.userName, status, ip, lat, lng, customDate, customTime, isMakeup })
        });
        apiData = await res.json();
    } catch(err) {
        console.error(err);
        apiData = { message:"網路連線異常，請至下方「今日打卡紀錄」確認是否已打卡成功" };
    }

    Swal.close(); 

    if (apiData.message && (apiData.message.includes("成功") || apiData.message.includes("更新"))) {
        sendSelfMessage({
            userName: window.userName,
            status: status,
            date: apiData.date,
            time: apiData.time,
            netType: window.allowRemote ? "異地打卡(GPS)" : "公司網路"
        }).catch(err => console.error("背景傳送訊息失敗", err));

        Swal.fire({
            icon: "success",
            title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
            html: `<div style="font-size: 16px; margin-top: 8px;"><strong>打卡時間：</strong><br><span style="color: #2980b9; font-size: 18px; font-weight: bold;">${apiData.date} ${apiData.time}</span></div>`,
            showConfirmButton: false, 
            timer: 1800, 
            backdrop: "rgba(0,0,0,0.5)",
            customClass: { popup: 'custom-swal-popup' }
        });
    } else {
        Swal.fire({
            icon: "error",
            title: "打卡提示",
            html: `<span style="color: #c0392b;">${apiData?.message || "打卡失敗，請檢查網路！"}</span>`,
            confirmButtonText: "確定",
            customClass: { popup: 'custom-swal-popup' }
        });
    }

    updateTodayRecords();
}

function getTodayString() {
    const now = new Date();
    return now.toLocaleDateString("zh-TW", { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, "/");
}

/* ===== 今日紀錄渲染 ===== */
async function updateTodayRecords(){
  if (!window.userId) return;
  
  try {
    const res = await fetch(`${API_ENDPOINT}?action=getToday&userId=${window.userId}&date=${getTodayString()}`);
    const data = await res.json();

    if (!data || !data.length) {
      todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
      return;
    }

    const recordsHTML = data.map(r => {
      let color = r.status === "下班" ? "#2ecc71" : "#3498db";
      const time = fixTimeFormat(r.time);
      const companyText = r.company ? r.company : "一般打卡";
      const makeupBadge = r.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";
      
      return `
        <div class="record-item" style="border-left-color: ${color};">
          <div class="record-info">
            <div class="record-status">${r.status} ${makeupBadge}</div>
            <div class="record-details">${companyText}</div>
          </div>
          <div class="record-time" style="color: ${color};">${time}</div>
        </div>
      `;
    }).join("");

    todayRecords.innerHTML = recordsHTML;
  } catch (err) {
    console.error(err);
    todayRecords.innerHTML = `<div class="records-empty" style="color: #e74c3c;">今日打卡紀錄讀取失敗</div>`;
  }
}

document.getElementById("btnStart").onclick = () => performClockIn("上班");
document.getElementById("btnEnd").onclick = () => performClockIn("下班");

document.getElementById("btnApprove").onclick = () => {
    window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
};

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奇可智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}

body {
    font-family: "Arial", "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}

.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 16px 16px 32px 16px;
    gap: 16px;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
}

.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}

#statusInfo {
    font-size: 14px; 
    font-weight: bold;
    color: white;
    padding: 6px 14px; 
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}

.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}

.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}

.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    border: 1px solid #edf2f7;
}

#timeHour, #timeMin, #timeSec {
    font-size: 38px;       
    font-weight: normal;   
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}

.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}

@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}

#btnStart { background: var(--start-gradient); }
#btnEnd { background: var(--end-gradient); }

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}

button:not(:disabled):active {
    transform: scale(0.97);
}

.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}

#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

@keyframes bounce {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.1); }
    50%  { transform: scale(0.95); }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.bounce { animation: bounce 0.4s ease; }

.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
</style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <div class="user-profile-container">
      <div class="user-avatar" id="userAvatar">👤</div>
      <div class="user-profile">
        <div id="userInfo">載入中...</div>
        <div class="app-subtitle" id="headerDate">載入日期中...</div>
      </div>
    </div>
    <div id="statusInfo">檢查中...</div>
  </div>

  <div class="dashboard-card">
    <div class="clock-container">
      <div class="time-box"><span id="timeHour">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeMin">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeSec">00</span></div>
    </div>

    <div class="buttons-container">
      <button id="btnStart" disabled>上班</button>
      <button id="btnEnd" disabled>下班</button>
    </div>
  </div>

  <div class="section-container">
    <div class="section-title" onclick="refreshTodayRecords()">📋 今日打卡紀錄</div>
    <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
  </div>

  <button id="btnApprove">補打卡審批</button>
</div>
 
<script>
/* =========================================================
   基本設定
========================================================= */
const API_ENDPOINT =
    "https://script.google.com/macros/s/AKfycbxdEnL9HTtQ9pVwiXeoW6DoVdwcQwanI4PuAdJMxFRadjjYNmRHqv2AJGbhWN-wZ7sT/exec";

const COMPANY_IPS = [
    "220.132.124.179",
    "125.228.248.110",
    "114.34.128.159",
    "220.134.230.241",
    "27.240.177.116",
    "114.32.2.171",
    "114.34.203.176"
];

const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86",
    "U7fdf4fbd467b9a93a23fac01ed03351b"
];

const LIFF_ID = "2008555754-M5oJ3AmD";

const APPROVE_URL =
    "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";

const IP_API = "https://api.ipify.org?format=json";

/* =========================================================
   DOM
========================================================= */
const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");
const approveButton = document.getElementById("btnApprove");

/* =========================================================
   全域狀態
========================================================= */
window.userReady = false;
window.clockSubmitting = false;
window.userId = "";
window.userName = "";
window.currentIP = "";
window.isCompanyNetwork = false;

/* =========================================================
   安全 HTML
========================================================= */
function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================================================
   日期時間
========================================================= */
function updateDateTime() {
    const now = new Date();
    const hour = String(now.getHours()).padStart(2, "0");
    const minute = String(now.getMinutes()).padStart(2, "0");
    const second = String(now.getSeconds()).padStart(2, "0");

    const hourEl = document.getElementById("timeHour");
    const minEl = document.getElementById("timeMin");
    const secEl = document.getElementById("timeSec");

    if (hourEl) hourEl.textContent = hour;
    if (minEl) minEl.textContent = minute;
    if (secEl) secEl.textContent = second;

    if (headerDate) {
        const dateStr = now.toLocaleDateString("zh-TW", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        });
        const weekdayStr = now.toLocaleDateString("zh-TW", {
            weekday: "long"
        });
        headerDate.textContent = `${dateStr} (${weekdayStr})`;
    }
}

setInterval(updateDateTime, 1000);
updateDateTime();

/* =========================================================
   今日日期
========================================================= */
function getTodayString() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}/${m}/${d}`;
}

/* =========================================================
   現在時間
========================================================= */
function getCurrentTime() {
    return new Date().toLocaleTimeString("zh-TW", {
        hour12: false
    });
}

/* =========================================================
   公司 IP
========================================================= */
function isCompanyIP(ip) {
    const cleanIP = String(ip || "").trim();
    return COMPANY_IPS.includes(cleanIP);
}

/* =========================================================
   Fetch Timeout
========================================================= */
async function fetchWithTimeout(
    url,
    options = {},
    timeout = 5000
) {
    const controller = new AbortController();
    const timer = setTimeout(() => {
        controller.abort();
    }, timeout);

    try {
        return await fetch(url, {
            ...options,
            signal: controller.signal
        });
    } finally {
        clearTimeout(timer);
    }
}

/* =========================================================
   IP
========================================================= */
async function getIP() {
    const cachedIP = sessionStorage.getItem("myIP");
    if (cachedIP) {
        window.currentIP = cachedIP;
        return cachedIP;
    }

    try {
        const response = await fetchWithTimeout(
            IP_API,
            {
                method: "GET",
                cache: "no-store"
            },
            1000
        );

        if (!response.ok) {
            return "";
        }

        const data = await response.json();
        const ip = String(data?.ip || "").trim();

        if (ip) {
            sessionStorage.setItem("myIP", ip);
            window.currentIP = ip;
            return ip;
        }
    } catch (error) {
        console.warn("取得 IP 失敗:", error);
    }
    return "";
}

/* =========================================================
   IP 預載
========================================================= */
function preloadIP() {
    if (sessionStorage.getItem("myIP")) {
        return;
    }
    getIP().catch(() => {});
}

/* =========================================================
   按鈕狀態
========================================================= */
function setButtonsDisabled(
    disabled,
    startText = "上班",
    endText = "下班"
) {
    if (btnStart) {
        btnStart.disabled = disabled;
        btnStart.textContent = startText;
    }
    if (btnEnd) {
        btnEnd.disabled = disabled;
        btnEnd.textContent = endText;
    }
}

/* =========================================================
   顯示使用者
========================================================= */
function renderUser(
    userId,
    userName,
    pictureUrl = ""
) {
    window.userId = String(userId || "").trim();
    window.userName = String(userName || "使用者");

    if (userInfo) {
        userInfo.textContent = `${window.userName} 您好`;
    }

    if (userAvatar) {
        if (pictureUrl) {
            userAvatar.innerHTML = `
                <img
                    src="${escapeHtml(pictureUrl)}"
                    alt="avatar"
                    style="width:100%;height:100%;border-radius:50%;object-fit:cover;"
                >
            `;
        } else {
            userAvatar.textContent = window.userName.charAt(0) || "👤";
        }
    }
}

/* =========================================================
   LIFF 使用者
========================================================= */
async function updateUserInfo() {
    if (typeof liff === "undefined") {
        throw new Error("LIFF SDK 尚未載入");
    }

    const liffPromise = liff.init({ liffId: LIFF_ID });
    const ipPromise = getIP();

    await liffPromise;

    if (!liff.isLoggedIn()) {
        await liff.login();
        return false;
    }

    const profile = await liff.getProfile();
    const ip = await ipPromise;

    renderUser(
        profile.userId,
        profile.displayName,
        profile.pictureUrl || ""
    );

    if (approveButton) {
        approveButton.style.display = MANAGERS.includes(window.userId) ? "block" : "none";
    }

    window.currentIP = ip;
    window.isCompanyNetwork = isCompanyIP(ip);

    if (statusInfo) {
        statusInfo.textContent = window.isCompanyNetwork ? "公司網路" : "非公司網路";
        statusInfo.style.background = window.isCompanyNetwork ? "#2ecc71" : "#e74c3c";
    }

    window.userReady = true;
    setButtonsDisabled(false, "上班", "下班");
    return true;
}

/* =========================================================
   時間格式
========================================================= */
function fixTimeFormat(t) {
    if (t === null || t === undefined || t === "") {
        return "00:00:00";
    }

    if (typeof t === "string" && t.includes(":") && !t.includes("T")) {
        const parts = t.split(":");
        while (parts.length < 3) {
            parts.push("00");
        }
        return parts.slice(0, 3).map(p => String(p).padStart(2, "0")).join(":");
    }

    if (typeof t === "string" && t.includes("T")) {
        const d = new Date(t);
        if (!isNaN(d.getTime())) {
            return d.toLocaleTimeString("zh-TW", { hour12: false });
        }
    }

    if (typeof t === "number" && !isNaN(t)) {
        const d = new Date((t - 25569) * 86400 * 1000);
        if (!isNaN(d.getTime())) {
            return d.toLocaleTimeString("zh-TW", { hour12: false });
        }
    }

    return String(t);
}

/* =========================================================
   Loading
========================================================= */
function showClockLoading(
    titleText = "打卡中",
    subText = "正在送出打卡資料..."
) {
    Swal.fire({
        html: `
            <div style="padding:15px 0;text-align:center;">
                <div style="width:50px;height:50px;margin:0 auto 18px;border:4px solid #f3f3f3;border-top:4px solid #3498db;border-radius:50%;animation:clockSpin .8s linear infinite;"></div>
                <h3 style="margin:0 0 8px;color:#2c3e50;font-size:20px;font-weight:bold;">${escapeHtml(titleText)}</h3>
                <p style="margin:0;color:#7f8c8d;font-size:14px;">${escapeHtml(subText)}</p>
                <style>
                    @keyframes clockSpin {
                        from { transform:rotate(0deg); }
                        to { transform:rotate(360deg); }
                    }
                </style>
            </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        backdrop: "rgba(0,0,0,0.5)",
        customClass: { popup: "custom-swal-popup" }
    });
}

/* =========================================================
   成功畫面
========================================================= */
function showClockSuccess(
    apiData,
    status,
    isMakeup,
    isCompany
) {
    const date = escapeHtml(apiData?.date || getTodayString());
    const time = escapeHtml(apiData?.time || getCurrentTime());

    if (isCompany) {
        Swal.fire({
            icon: "success",
            title: isMakeup ? "🎉 補打卡成功！" : status === "下班" ? "🎉 下班打卡成功！" : "🎉 上班打卡成功！",
            html: `
                <div style="font-size:16px;margin-top:8px;">
                    <strong>打卡時間：</strong>
                    <br>
                    <span style="color:#2980b9;font-size:18px;font-weight:bold;">${date} ${time}</span>
                </div>
            `,
            showConfirmButton: false,
            timer: 2000,
            backdrop: "rgba(0,0,0,0.5)",
            customClass: { popup: "custom-swal-popup" }
        });
    } else {
        Swal.fire({
            icon: "warning",
            title: isMakeup ? "⚠ 異地補打卡" : "⚠ 非公司網路",
            html: `
                <div style="font-size:16px;color:#3498db;font-weight:bold;margin-top:8px;">◎ 打卡資料已送出 ◎</div>
                <br>
                <small>打卡時間：${date} ${time}</small>
            `,
            showConfirmButton: false,
            timer: 2500,
            backdrop: "rgba(0,0,0,0.5)",
            customClass: { popup: "custom-swal-popup" }
        });
    }
}

/* =========================================================
   今日紀錄 Cache
========================================================= */
function getCachedTodayRecords() {
    try {
        const cache = sessionStorage.getItem("cached_today_records");
        if (!cache) return null;
        return JSON.parse(cache);
    } catch (error) {
        console.warn("今日紀錄 Cache 解析失敗:", error);
        return null;
    }
}

/* =========================================================
   渲染今日紀錄
========================================================= */
function renderTodayRecords(data) {
    if (!todayRecords) return;

    if (!Array.isArray(data) || data.length === 0) {
        todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
        return;
    }

    const recordsHTML = data.map(record => {
        const status = String(record?.status || "");
        const color = status === "下班" ? "#2ecc71" : "#3498db";
        const time = fixTimeFormat(record?.time);
        const ip = String(record?.ip || "").trim();
        const company = isCompanyIP(ip);
        const networkLabel = company ? "公司網路" : "異地打卡";
        const networkColor = company ? "#7f8c8d" : "#e67e22";
        const makeupBadge = record?.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";

        return `
            <div class="record-item" style="border-left-color:${color};">
                <div class="record-info">
                    <div class="record-status">${escapeHtml(status)} ${makeupBadge}</div>
                    <div class="record-details" style="color:${networkColor};">${networkLabel}</div>
                </div>
                <div class="record-time" style="color:${color};">${escapeHtml(time)}</div>
            </div>
        `;
    }).join("");

    todayRecords.innerHTML = recordsHTML;
}

/* =========================================================
   今日紀錄
========================================================= */
async function updateTodayRecords(showLoading = false) {
    if (!window.userId || !todayRecords) return;

    const cached = getCachedTodayRecords();
    if (cached) {
        renderTodayRecords(cached);
    } else if (showLoading) {
        todayRecords.innerHTML = `
            <div class="record-item" style="border-left-color:#bdc3c7;opacity:.6;">
                <div class="record-info">
                    <div style="background:#e0e0e0;width:80px;height:16px;border-radius:4px;margin-bottom:6px;"></div>
                    <div style="background:#e0e0e0;width:60px;height:12px;border-radius:4px;"></div>
                </div>
                <div style="background:#e0e0e0;width:50px;height:20px;border-radius:4px;"></div>
            </div>
        `;
    }

    try {
        const today = getTodayString();
        const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(today)}`;
        const response = await fetchWithTimeout(
            url,
            { method: "GET", mode: "cors", redirect: "follow", cache: "no-store" },
            4000
        );

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        sessionStorage.setItem("cached_today_records", JSON.stringify(data));
        renderTodayRecords(data);
    } catch (error) {
        console.warn("今日紀錄背景更新失敗:", error);
        if (!cached) {
            todayRecords.innerHTML = `<div class="records-empty" style="color:#e67e22;">今日紀錄暫時無法更新</div>`;
        }
    }
}

/* =========================================================
   LINE 自己訊息
========================================================= */
async function sendSelfMessage(record) {
    try {
        if (typeof liff === "undefined" || !liff.isInClient()) return;

        let headerColor = "#3498db";
        if (record.status === "下班") headerColor = "#2ecc71";
        if (record.networkStatus !== "公司網路") headerColor = "#e67e22";

        const reasonText = record.networkStatus !== "公司網路" ? "異常原因：非公司網路" : "";

        await liff.sendMessages([
            {
                type: "flex",
                altText: `【打卡通知】${record.status}成功`,
                contents: {
                    type: "bubble",
                    header: {
                        type: "box",
                        layout: "vertical",
                        contents: [
                            {
                                type: "text",
                                text: `${String(record.userName)} 已打卡`,
                                weight: "bold",
                                size: "lg",
                                color: "#ffffff"
                            }
                        ],
                        backgroundColor: headerColor,
                        paddingAll: "12px"
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        spacing: "md",
                        contents: [
                            { type: "text", text: `狀態：${String(record.status)}`, size: "md" },
                            { type: "text", text: `時間：${String(record.date)} ${String(record.time)}`, size: "md" },
                            { type: "text", text: `網路：${String(record.networkStatus)}`, size: "md" },
                            ...(reasonText ? [{ type: "text", text: reasonText, size: "md", color: "#e67e22" }] : [])
                        ]
                    }
                }
            }
        ]);
    } catch (error) {
        console.warn("LINE 訊息傳送失敗:", error);
    }
}

/* =========================================================
   打卡 API
========================================================= */
async function submitClock(clockData) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => { controller.abort(); }, 2000);

    try {
        const response = await fetch(API_ENDPOINT, {
            method: "POST",
            mode: "cors",
            redirect: "follow",
            signal: controller.signal,
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(clockData)
        });

        clearTimeout(timeoutId);
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        try {
            const json = await response.json();
            if (json && typeof json === "object") return json;
        } catch (jsonError) {
            console.warn("API JSON 解析失敗:", jsonError);
        }
        return null;
    } catch (error) {
        clearTimeout(timeoutId);
        if (error?.name === "AbortError") {
            console.warn("打卡 API 超過 2 秒，停止等待");
        } else {
            console.warn("打卡 API 網路錯誤:", error);
        }
        return null;
    }
}
